<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ramasse journaliere{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1><a href="{{ url_for('saisie') }}">Ramasse journaliere</a></h1>
    <nav class="nav-admin">
      <a href="{{ url_for('saisie') }}">Saisie</a>
      <a href="{{ url_for('admin.magasins_liste') }}">Magasins</a>
      <a href="{{ url_for('admin.parametres_liste', slug='fournisseurs') }}">Fournisseurs</a>
      <a href="{{ url_for('admin.parametres_liste', slug='articles') }}">Articles</a>
      <a href="{{ url_for('admin.parametres_liste', slug='types') }}">Types de ramasse</a>
      <a href="{{ url_for('admin.epuration') }}">Epuration</a>
      <a href="{{ url_for('admin.sauvegarde') }}">Sauvegarde</a>
    </nav>
  </header>

  <main class="conteneur">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages">
          {% for categorie, msg in messages %}
            <div class="msg msg-{{ categorie }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
