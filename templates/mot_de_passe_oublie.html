{% extends "base.html" %}
{% block title %}Mot de passe oublie{% endblock %}
{% block content %}
<div class="page-connexion">
  <h2>Mot de passe oublie</h2>
  <p class="aide">
    Saisissez votre login (email). Si ce compte existe, un lien pour choisir
    un nouveau mot de passe vous est envoye par e-mail, valable 1 heure.
  </p>
  <form method="post" class="champs-entete">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="champ">
      <label for="login">Login (adresse email)</label>
      <input type="email" name="login" id="login" value="{{ login }}" required autofocus>
    </div>
    <div class="champ actions">
      <button type="submit" class="bouton bouton-valide">Envoyer le lien</button>
    </div>
  </form>
  <p class="aide">
    <a href="{{ url_for('auth.login') }}">Retour a la connexion</a>
  </p>
</div>
{% endblock %}
